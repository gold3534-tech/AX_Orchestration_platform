research_task:
  description: >
    최신 IT 뉴스와 기술 트렌드를 조사하라.

    [기본 컨텍스트]
    - 오늘 날짜: {current_date}
    - 조사 기간: 최근 7일 이내 ({date_range_start} ~ {current_date}) 에 발행된 내용
    - 카테고리/주제: {topic} (비어 있으면 이번 주 주목할 IT 트렌드를 자율 선정)
    - 추가 컨텍스트: {additional_details}

    [AEO 기반 검색 전략]
    - 검색 쿼리는 단순 키워드 나열을 피하고, "최근 7일간 마케터를 위해 출시된 AI 자동화 도구는?"과 같은 구체적인 '자연어 질문형'으로 작성할 것.
    - SEO 양산형 블로그를 배제하고, 공식 웹사이트, 신뢰도 높은 테크 매체(TechCrunch 등), 혹은 GitHub/Reddit 등 1차 출처(Primary Source)를 우선적으로 탐색할 것.
    - 검색은 최대 2회, 스크래핑은 가장 신뢰도 높은 최대 2개 소스만 수행.

    [수집 우선순위 포맷]
    1. '툴 리스트' 형식 — 독자가 당장 써볼 수 있는 구체적인 도구 소개
    2. '체크리스트' 형식 — 독자가 즉시 따라 할 수 있는 단계별 액션 플랜
    3. '가이드' 형식 — 핵심 개념 설명과 실무 적용 팁
    4. 단순 뉴스 (위 포맷이 없을 경우에만)

expected_output: >
  다음 구조를 엄격히 준수한 리서치 보고서:
  1. 선정 주제 및 선정 이유 (최근 7일간의 트렌드 맥락 반영)
  2. 수집 소스 리스트 (제목, 공식 URL, 발행일)
  3. 카드뉴스용 구조화된 핵심 포인트 3가지 (두루뭉술한 설명 금지. 명확한 도구 이름(Entity), 1줄 핵심 기능, 독자가 얻을 수 있는 구체적 이점을 포함할 것)
agent: it_researcher_agent


content_creation_task:
  description: >
    research_task에서 전달받은 '리서치 보고서'를 바탕으로 
    독자의 이목을 끄는 인스타그램 카드뉴스 텍스트와 캡션을 작성하라.

    [슬라이드 구성 규칙: 총 4장]
    - 슬라이드 텍스트(표지, 본문, 마무리)에는 **이모지를 사용하지 말 것**
    - 아래의 [본문 예시]를 따라 포맷과 길이감을 따라할 것.
    
    1. 표지 (1장): AEO 기반으로 타겟 독자(마케터/IT직장인)의 페인포인트(Pain-point)를 건드리는 한 줄 (20자 이내)
    2. 본문 (2장): 리서치에서 도출된 핵심 포인트를 각각 1장씩 배정. 
       - 구성:
         1) 명확한 소제목 (15자 이내)
         2) 핵심 요약 (20자 이내. 문장 끝은 명사형으로 끝낼 것)
    3. 마무리 (1장): 오늘 소개한 내용의 1줄 핵심 요약만. 
    
    [본문 예시]
    고해상도 비전 분석
    포인트 1: 수동 문서 작업 80% 자동화
    포인트 2: 복잡한 차트 및 인보이스 즉시 처리

    [캡션 규칙]
    - 길이: 500자 이내
    - AEO 최적화 구조 (반드시 아래의 3단 포맷을 따를 것):
      1. 질문(Hook): 타겟 독자가 검색할 법한 구체적인 키워드(고유명사)가 포함된 질문 1줄. 
         (예: "💡 마케터와 PM의 업무를 자동화할 Anthropic의 최신 업데이트는?")
      2. 빠른 답변(Value): 핵심 사실을 이모지와 함께 요약한 2~3줄. 서술형 줄글 금지.
      3. 결론/CTA: 1줄 요약 및 행동 유도

    [해시태그 규칙]
    - IT 트렌드와 본문 내용에 정확히 부합하는 핵심 해시태그 5~8개 선정

  expected_output: >
    4장의 슬라이드 텍스트, 인스타그램 캡션 본문, 해시태그 리스트가 포함된 완성된 콘텐츠 원고.
  agent: content_creator_agent
  context:
    - research_task
